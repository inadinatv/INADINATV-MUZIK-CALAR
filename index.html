<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<meta name="theme-color" content="#0d0d0f"/>
<meta name="description" content="Türkçe ve Kürtçe müzikler için İNADINA TV Müzik Çalar"/>
<title>İNADINA TV MÜZİK ÇALAR</title>
<link rel="preconnect" href="https://fonts.googleapis.com"/>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Space+Grotesk:wght@500;700&display=swap" rel="stylesheet"/>
<style>
:root {
  --bg:      #0d0d0f;
  --surf:    #141417;
  --card:    #1c1c22;
  --border:  #2a2a35;
  --accent:  #a259ff;
  --accent2: #c084fc;
  --text:    #f0f0f8;
  --muted:   #6b6b80;
  --safe-b:  env(safe-area-inset-bottom, 0px);
  --topbar-h: 0px;
}

*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
html { height: 100%; }
body {
  font-family: 'Inter', sans-serif;
  background: var(--bg);
  color: var(--text);
  height: 100dvh;
  overflow: hidden;
  display: flex;
  flex-direction: column;
}

/* ══ TOP BAR ════════════════════════════════════ */
#topbar {
  flex-shrink: 0;
  background: var(--surf);
  border-bottom: 1px solid var(--border);
  padding: 14px 16px 10px;
  display: flex;
  flex-direction: column;
  gap: 10px;
}

.logo {
  font-family: 'Space Grotesk', sans-serif;
  font-size: 22px; font-weight: 700;
  color: var(--accent2);
  letter-spacing: -0.5px;
}
.logo em { color: var(--text); font-style: normal; }

.search-row { display: flex; gap: 8px; }
.search-row input {
  flex: 1; min-width: 0;
  background: var(--card);
  border: 1.5px solid var(--border);
  border-radius: 12px;
  padding: 10px 14px;
  font-size: 14px; color: var(--text);
  font-family: inherit; outline: none;
  -webkit-appearance: none;
  transition: border-color .2s;
}
.search-row input:focus { border-color: var(--accent); }
.search-row input::placeholder { color: var(--muted); }
.search-row button {
  flex-shrink: 0;
  background: var(--accent);
  border: none; border-radius: 12px;
  padding: 10px 18px;
  color: #fff; font-size: 14px; font-weight: 600;
  font-family: inherit; cursor: pointer;
}

.tabs {
  display: flex; gap: 8px;
  overflow-x: auto; -webkit-overflow-scrolling: touch;
  scrollbar-width: none; padding-bottom: 2px;
}
.tabs::-webkit-scrollbar { display: none; }
.tab {
  flex-shrink: 0;
  padding: 7px 18px;
  border-radius: 20px;
  border: 1.5px solid var(--border);
  background: transparent;
  color: var(--muted); font-size: 13px; font-weight: 500;
  font-family: inherit; cursor: pointer;
  transition: all .15s;
}
.tab.active { background: var(--accent); border-color: var(--accent); color: #fff; }

/* ══ SCROLL AREA ════════════════════════════════ */
#main {
  flex: 1;
  overflow-y: auto; overflow-x: hidden;
  -webkit-overflow-scrolling: touch;
  padding: 16px 14px 160px;
}

.section-title {
  font-family: 'Space Grotesk', sans-serif;
  font-size: 18px; font-weight: 700;
  margin-bottom: 14px;
}

/* ── Track list ─────────────────────── */
.track-list { display: flex; flex-direction: column; gap: 1px; }

.track-item {
  display: grid;
  grid-template-columns: 52px 1fr 32px 34px;
  align-items: center;
  gap: 12px;
  padding: 7px 8px;
  border-radius: 10px;
  cursor: pointer;
  -webkit-tap-highlight-color: transparent;
  transition: background .12s;
}
.track-item:active, .track-item:hover { background: var(--card); }
.track-item.playing { background: rgba(162,89,255,.13); }

.track-cover {
  width: 52px; height: 52px;
  border-radius: 8px;
  object-fit: cover;
  background: var(--border);
  display: block; flex-shrink: 0;
}
.track-info { overflow: hidden; }
.track-title {
  font-size: 14px; font-weight: 500;
  white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
}
.track-item.playing .track-title { color: var(--accent2); }
.track-artist {
  font-size: 12px; color: var(--muted); margin-top: 2px;
  white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
}
.track-dur { font-size: 11px; color: var(--muted); text-align: right; }

/* ── Botão de download ──────────────── */
.track-dl, .qi-dl {
  background: none; border: none; color: var(--muted);
  cursor: pointer; padding: 6px; border-radius: 50%;
  display: flex; align-items: center; justify-content: center;
  -webkit-tap-highlight-color: transparent;
  transition: color .15s;
}
.track-dl:active, .qi-dl:active { color: var(--accent2); background: var(--border); }
.track-dl.downloading svg { animation: dl-pulse 1s ease-in-out infinite; }
@keyframes dl-pulse { 0%,100% { opacity: 1; } 50% { opacity: .35; } }

/* ── Card grid ──────────────────────── */
.card-grid {
  display: grid;
  grid-template-columns: repeat(2, 1fr);
  gap: 12px;
}
@media (min-width: 480px) { .card-grid { grid-template-columns: repeat(3, 1fr); } }

.card {
  background: var(--card);
  border-radius: 12px; overflow: hidden;
  cursor: pointer; border: 1px solid var(--border);
  -webkit-tap-highlight-color: transparent;
  transition: transform .15s;
}
.card:active { transform: scale(0.96); }
.card-cover { width: 100%; aspect-ratio: 1; object-fit: cover; display: block; background: var(--border); }
.card-body { padding: 9px 10px 11px; }
.card-title { font-size: 13px; font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.card-sub { font-size: 11px; color: var(--muted); margin-top: 2px; }

/* ── Collection detail (album/playlist/artist) ─── */
.collection-hero {
  display: flex; flex-direction: column; align-items: center; text-align: center;
  padding: 8px 12px 26px;
}
.ch-cover {
  width: 176px; height: 176px; border-radius: 16px;
  object-fit: cover; background: var(--card);
  box-shadow: 0 18px 44px rgba(0,0,0,.55);
  margin-bottom: 16px;
}
.ch-cover.artist { border-radius: 50%; }
.ch-type {
  font-size: 11px; font-weight: 700; letter-spacing: 1.5px; text-transform: uppercase;
  color: var(--accent2); margin-bottom: 6px;
}
.ch-title {
  font-family: 'Space Grotesk', sans-serif;
  font-size: 21px; font-weight: 700; margin-bottom: 5px;
  max-width: 90%;
}
.ch-sub { font-size: 13px; color: var(--muted); margin-bottom: 3px; }
.ch-meta { font-size: 12px; color: var(--muted); margin-bottom: 16px; }
.ch-desc {
  font-size: 12.5px; color: var(--muted); line-height: 1.55;
  max-width: 440px; margin: 0 auto 18px;
}
.ch-actions { display: flex; gap: 10px; margin-top: 2px; }
.ch-btn {
  display: flex; align-items: center; gap: 6px;
  border: none; border-radius: 999px; padding: 10px 22px;
  font-family: inherit; font-size: 13px; font-weight: 600; cursor: pointer;
  -webkit-tap-highlight-color: transparent;
}
.ch-play { background: var(--accent); color: #fff; }
.ch-play:active { background: var(--accent2); }
.ch-shuffle-btn { background: var(--card); color: var(--text); border: 1px solid var(--border); }
.ch-shuffle-btn:active { background: var(--border); }

/* ── States ─────────────────────────── */
.empty { text-align: center; color: var(--muted); padding: 60px 20px; font-size: 14px; }
.spinner {
  width: 30px; height: 30px;
  border: 3px solid var(--border); border-top-color: var(--accent);
  border-radius: 50%; animation: spin .7s linear infinite;
  margin: 60px auto;
}
@keyframes spin { to { transform: rotate(360deg); } }

/* ══ MINI PLAYER ════════════════════════════════ */
#mini-player {
  position: fixed;
  bottom: calc(var(--safe-b) + 64px);
  left: 8px; right: 8px;
  background: rgba(20, 16, 36, 0.72);
  backdrop-filter: blur(24px) saturate(1.8);
  -webkit-backdrop-filter: blur(24px) saturate(1.8);
  border: 1px solid rgba(162,89,255,.25);
  border-radius: 16px;
  padding: 10px 14px;
  display: none;
  align-items: center;
  gap: 12px;
  z-index: 60;
  cursor: pointer;
  box-shadow: 0 8px 40px rgba(0,0,0,.7), inset 0 1px 0 rgba(255,255,255,.06);
  -webkit-tap-highlight-color: transparent;
  transition: box-shadow .3s;
}
#mini-player.visible { display: flex; }

#mini-cover {
  width: 42px; height: 42px;
  border-radius: 8px; object-fit: cover;
  background: var(--border); flex-shrink: 0;
}
.mini-text { flex: 1; overflow: hidden; }
#mini-title {
  font-size: 13px; font-weight: 600;
  white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
  color: var(--text);
}
#mini-artist { font-size: 11px; color: var(--muted); margin-top: 1px; }

.mini-btns { display: flex; align-items: center; gap: 4px; flex-shrink: 0; }
.mini-btn {
  background: none; border: none;
  color: var(--muted); cursor: pointer;
  padding: 7px; border-radius: 50%;
  display: flex; align-items: center;
  -webkit-tap-highlight-color: transparent;
}
.mini-btn:active { color: var(--text); }
.mini-play-btn {
  width: 38px; height: 38px;
  background: var(--accent); color: #fff;
  border-radius: 50%;
  display: flex; align-items: center; justify-content: center;
}
.mini-play-btn:active { background: var(--accent2); }

.mini-prog {
  position: absolute;
  bottom: 0; left: 14px; right: 14px; height: 2px;
  background: var(--border); border-radius: 1px; overflow: hidden;
}
.mini-prog-fill { height: 100%; background: var(--accent2); border-radius: 1px; width: 0%; }

/* ══ BOTTOM NAV ═════════════════════════════════ */
#bottom-nav {
  position: fixed;
  bottom: 0; left: 0; right: 0;
  height: calc(56px + var(--safe-b));
  background: var(--surf);
  border-top: 1px solid var(--border);
  display: flex; align-items: flex-start;
  padding-top: 8px;
  z-index: 70;
}
.nav-btn {
  flex: 1; display: flex; flex-direction: column; align-items: center;
  gap: 3px; background: none; border: none; cursor: pointer;
  color: var(--muted); font-size: 10px; font-family: inherit;
  -webkit-tap-highlight-color: transparent;
  padding: 0;
}
.nav-btn svg { display: block; }
.nav-btn.active { color: var(--accent2); }
.nav-btn span { font-size: 10px; font-weight: 500; }

/* ══ FULL PLAYER SHEET ══════════════════════════ */
#player-sheet {
  position: fixed; inset: 0;
  z-index: 200;
  display: flex; flex-direction: column;
  transform: translateY(100%);
  transition: background .6s ease, transform .35s cubic-bezier(.4,0,.2,1);
  background: var(--bg);
  overflow: hidden;
  will-change: transform;
}
#player-sheet.open { transform: translateY(0); }

/* modo paisagem: capa à esquerda, tudo mais à direita */
@media (orientation: landscape) {
  #player-sheet.open {
    flex-direction: row;
    align-items: stretch;
  }
  #player-sheet .ps-cover-wrap {
    flex: 0 0 42%;
    padding: 16px 16px 16px 20px;
    align-items: center;
    justify-content: center;
  }
  #player-sheet .ps-right-col {
    flex: 1;
    display: flex;
    flex-direction: column;
    overflow: hidden;
    padding-top: 8px;
  }
  #player-sheet .ps-header {
    padding-top: 12px;
  }
  .ps-swipe-handle { display: none; }
}

.ps-header {
  flex-shrink: 0;
  display: flex; align-items: center; justify-content: space-between;
  padding: 16px 20px 8px;
}
.ps-label { font-size: 11px; font-weight: 600; letter-spacing: 1px; text-transform: uppercase; color: var(--muted); text-align: center; flex: 1; }
.ps-close, .ps-more {
  background: none; border: none; color: var(--muted);
  cursor: pointer; padding: 6px; border-radius: 8px;
  display: flex; align-items: center;
  -webkit-tap-highlight-color: transparent;
}
.ps-close:active, .ps-more:active { background: var(--card); color: var(--text); }

.ps-cover-wrap {
  flex: 1; display: flex; align-items: center; justify-content: center;
  padding: 0 32px;
  min-height: 0;
  touch-action: pan-y;
}
#ps-cover {
  width: 100%; max-width: 320px; max-height: 320px; aspect-ratio: 1;
  object-fit: cover;
  border-radius: 20px;
  background: var(--card);
  box-shadow: 0 24px 60px rgba(0,0,0,.7);
  display: block;
  transition: transform .5s cubic-bezier(.4,0,.2,1), box-shadow .5s ease;
}
#ps-cover.paused {
  transform: scale(0.91);
  box-shadow: 0 12px 32px rgba(0,0,0,.5) !important;
}

.ps-info {
  flex-shrink: 0;
  padding: 20px 28px 0;
  display: flex; align-items: center; gap: 16px;
}
.ps-text { flex: 1; overflow: hidden; }
#ps-title {
  font-family: 'Space Grotesk', sans-serif;
  font-size: 22px; font-weight: 700;
  white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
}
#ps-artist { font-size: 14px; color: var(--muted); margin-top: 4px; }

.ps-progress {
  flex-shrink: 0;
  padding: 18px 28px 4px;
}
.ps-bar-wrap {
  position: relative; height: 4px;
  background: var(--border); border-radius: 2px;
}
#ps-fill { height: 100%; background: var(--accent2); border-radius: 2px; width: 0%; pointer-events: none; }

.ps-times { display: flex; justify-content: space-between; margin-top: 6px; }
.ps-times span { font-size: 11px; color: var(--muted); }

.ps-controls {
  flex-shrink: 0;
  display: flex; align-items: center; justify-content: space-between;
  padding: 4px 28px 8px;
}
.pc-btn {
  background: none; border: none; color: var(--muted);
  cursor: pointer; padding: 10px; border-radius: 50%;
  display: flex; align-items: center; justify-content: center;
  -webkit-tap-highlight-color: transparent;
  transition: color .15s;
}
.pc-btn:active { color: var(--text); }
.pc-btn.active { color: var(--accent2); }
.pc-play {
  width: 64px; height: 64px;
  background: var(--accent); color: #fff;
  border-radius: 50%;
  display: flex; align-items: center; justify-content: center;
  border: none; cursor: pointer;
  box-shadow: 0 8px 24px rgba(162,89,255,.4);
  -webkit-tap-highlight-color: transparent;
  flex-shrink: 0;
}
.pc-play:active { transform: scale(0.95); }

.ps-queue-row {
  flex-shrink: 0;
  display: flex; justify-content: space-around; align-items: center;
  padding: 2px 28px calc(var(--safe-b) + 20px);
}
.pq-btn {
  background: none; border: none; color: var(--muted);
  cursor: pointer; font-family: inherit; font-size: 11px; font-weight: 600;
  letter-spacing: .5px; text-transform: uppercase;
  display: flex; flex-direction: column; align-items: center; gap: 4px;
  padding: 8px 16px; border-radius: 10px;
  -webkit-tap-highlight-color: transparent;
}
.pq-btn:active { background: var(--card); color: var(--text); }
.pq-btn svg { color: var(--muted); }
.pq-btn.active svg { color: var(--accent2); }

/* ══ QUEUE SHEET ════════════════════════════════ */
#queue-sheet {
  position: fixed; inset: 0; z-index: 300;
  display: flex; flex-direction: column; justify-content: flex-end;
  visibility: hidden; pointer-events: none;
}
#queue-sheet.open { visibility: visible; pointer-events: auto; }
.qs-backdrop {
  position: absolute; inset: 0; background: rgba(0,0,0,.6);
  opacity: 0; transition: opacity .28s ease;
}
#queue-sheet.open .qs-backdrop { opacity: 1; }
.qs-drawer {
  position: relative; background: var(--surf);
  border-radius: 20px 20px 0 0;
  border-top: 1px solid var(--border);
  max-height: 72dvh; display: flex; flex-direction: column;
  transform: translateY(100%);
  transition: transform .3s cubic-bezier(.22,1,.36,1);
  will-change: transform;
  touch-action: pan-y;
}
#queue-sheet.open .qs-drawer { transform: translateY(0); }
.qs-handle { display: flex; justify-content: center; padding: 12px 0 0; }
.qs-handle::after { content:''; width:36px; height:4px; background:var(--border); border-radius:2px; display:block; }
.qs-head {
  display: flex; justify-content: space-between; align-items: center;
  padding: 10px 20px 12px; border-bottom: 1px solid var(--border); flex-shrink: 0;
}
.qs-head h3 { font-size: 15px; font-weight: 600; }
.qs-clear { background:none; border:none; color:var(--muted); font-size:12px; font-family:inherit; cursor:pointer; }
#queue-list { overflow-y: auto; -webkit-overflow-scrolling: touch; flex:1; padding: 6px 0 calc(var(--safe-b) + 8px); }
.qi {
  display: flex; align-items: center; gap: 12px;
  padding: 9px 16px; cursor: pointer;
  -webkit-tap-highlight-color: transparent;
}
.qi:active { background: var(--card); }
.qi.now { background: rgba(162,89,255,.1); }
.qi img { width:42px; height:42px; border-radius:7px; object-fit:cover; flex-shrink:0; }
.qi-info { overflow:hidden; flex:1; }
.qi-t { font-size:13px; font-weight:500; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
.qi-a { font-size:11px; color:var(--muted); }
.qi.now .qi-t { color: var(--accent2); }
.qi-rm { background:none; border:none; color:var(--muted); font-size:18px; padding:4px; cursor:pointer; flex-shrink:0; }


/* ══ COR DOMINANTE DINÂMICA ═════════════════════ */
#player-sheet {
  transition: background .6s ease, transform .35s cubic-bezier(.4,0,.2,1);
}
#player-sheet::before {
  content: '';
  position: absolute; inset: 0;
  background: inherit;
  filter: blur(60px) brightness(.5);
  z-index: -1;
  opacity: .7;
  transition: background .6s ease;
}

/* ══ CAPA COM ANIMAÇÃO PLAY/PAUSE ════════════════ */
#ps-cover {
  transition: transform .5s cubic-bezier(.4,0,.2,1), box-shadow .5s ease;
}
#ps-cover.paused {
  transform: scale(0.91);
  box-shadow: 0 12px 32px rgba(0,0,0,.5) !important;
}

/* ══ BARRA DE PROGRESSO ESTILIZADA ══════════════ */
#ps-seek {
  position: absolute; inset: -10px 0;
  width: 100%; height: 24px;
  opacity: 1;
  -webkit-appearance: none;
  appearance: none;
  background: transparent;
  cursor: pointer;
}
#ps-seek::-webkit-slider-thumb {
  -webkit-appearance: none;
  appearance: none;
  width: 14px; height: 14px;
  border-radius: 50%;
  background: var(--dom-accent, var(--accent2));
  box-shadow: 0 0 6px rgba(192,132,252,.6);
  margin-top: -5px;
  transition: transform .15s;
}
#ps-seek:active::-webkit-slider-thumb { transform: scale(1.3); }
#ps-seek::-webkit-slider-runnable-track {
  height: 4px;
  border-radius: 2px;
  background: transparent;
}
#ps-fill {
  background: var(--dom-accent, var(--accent2));
  transition: background .6s ease;
}
.mini-prog-fill {
  background: var(--dom-accent, var(--accent2));
  transition: background .6s ease, width .1s linear;
}

/* ══ SKELETON LOADING ════════════════════════════ */
.skeleton-list { display: flex; flex-direction: column; gap: 1px; }
.skeleton-item {
  display: grid;
  grid-template-columns: 52px 1fr;
  align-items: center;
  gap: 12px;
  padding: 7px 8px;
  border-radius: 10px;
  animation: sk-fade 1.4s ease-in-out infinite;
}
@keyframes sk-fade {
  0%, 100% { opacity: 1; }
  50%       { opacity: .4; }
}
.skeleton-item:nth-child(2) { animation-delay: .1s; }
.skeleton-item:nth-child(3) { animation-delay: .2s; }
.skeleton-item:nth-child(4) { animation-delay: .3s; }
.skeleton-item:nth-child(5) { animation-delay: .4s; }
.skeleton-item:nth-child(6) { animation-delay: .5s; }
.sk-thumb { width: 52px; height: 52px; border-radius: 8px; background: var(--card); flex-shrink: 0; }
.sk-lines { display: flex; flex-direction: column; gap: 8px; }
.sk-line { height: 10px; border-radius: 5px; background: var(--card); }
.sk-line.wide { width: 70%; }
.sk-line.narrow { width: 45%; }

/* ══ ANIMAÇÃO EM CASCATA NAS LISTAS ══════════════ */
@keyframes fadeSlideUp {
  from { opacity: 0; transform: translateY(16px); }
  to   { opacity: 1; transform: translateY(0); }
}
.track-item, .card {
  animation: fadeSlideUp .3s ease both;
}

/* ══ WAVEFORM NO MINI PLAYER ═════════════════════ */
.waveform {
  display: none;
  align-items: flex-end;
  gap: 2px;
  height: 16px;
  margin-right: 2px;
}
.waveform.playing { display: flex; }
.wv-bar {
  width: 3px;
  border-radius: 2px;
  background: var(--dom-accent, var(--accent2));
  animation: wv-bounce 1s ease-in-out infinite;
}
.wv-bar:nth-child(1) { height: 6px;  animation-delay: 0s;    animation-duration: .9s; }
.wv-bar:nth-child(2) { height: 14px; animation-delay: .15s;  animation-duration: .7s; }
.wv-bar:nth-child(3) { height: 9px;  animation-delay: .3s;   animation-duration: 1.1s; }
@keyframes wv-bounce {
  0%, 100% { transform: scaleY(.4); }
  50%       { transform: scaleY(1); }
}

/* ══ BOTÃO COMPARTILHAR ══════════════════════════ */
.ps-share-btn {
  background: none; border: none;
  color: var(--muted); cursor: pointer;
  padding: 6px; border-radius: 8px;
  display: flex; align-items: center;
  -webkit-tap-highlight-color: transparent;
  transition: color .15s;
}

<script>
const audio = document.getElementById('audio');
let queue = [], qIdx = -1, searchType = 'track';
let shuffle = false, repeatMode = 'none';
let tracksCache = [];
let lastRender = null;
let LIB = null;

const fmt = s => `${Math.floor(s/60)}:${String(Math.floor(s%60)).padStart(2,'0')}`;
const esc = s => String(s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
const $id = id => document.getElementById(id);

// ── Biblioteca local ────────────────────────────────
async function loadLibrary(force) {
  if (LIB && !force) return LIB;
  const r = await fetch('/api/library' + (force ? '?rescan=1' : ''));
  LIB = await r.json();
  return LIB;
}

function groupBy(tracks, keyFn) {
  const m = new Map();
  tracks.forEach(t => {
    const k = keyFn(t) || '—';
    if (!m.has(k)) m.set(k, []);
    m.get(k).push(t);
  });
  return m;
}
function albumGroups(tracks) {
  return [...groupBy(tracks.filter(t => t.album), t => t.album).entries()]
    .map(([album, ts]) => ({ id: album, title: album, artist: ts[0].artist, cover_id: ts[0].id, count: ts.length }))
    .sort((a,b) => a.title.localeCompare(b.title));
}
function artistGroups(tracks) {
  return [...groupBy(tracks, t => t.artist).entries()]
    .map(([artist, ts]) => ({ id: artist, name: artist, cover_id: ts[0].id, count: ts.length }))
    .sort((a,b) => a.name.localeCompare(b.name));
}
function playlistGroups(tracks) {
  return [...groupBy(tracks.filter(t => t.folder), t => t.folder).entries()]
    .map(([folder, ts]) => ({ id: folder, name: folder, cover_id: ts[0].id, count: ts.length }))
    .sort((a,b) => a.name.localeCompare(b.name));
}

// ── Renderers ──────────────────────────────────────
const EDIT_ICON = '<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M17 3a2.85 2.83 0 1 1 4 4L7.5 20.5 2 22l1.5-5.5Z"/></svg>';
const DL_ICON = '<svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="7 10 12 15 17 10"/><line x1="12" y1="15" x2="12" y2="3"/></svg>';

function buildTrackList(tracks) {
  const ul = document.createElement('div');
  ul.className = 'track-list';
  tracks.forEach((t, i) => {
    const d = document.createElement('div');
    d.className = 'track-item' + (queue[qIdx]?.id === t.id ? ' playing' : '');
    d.innerHTML = `
      <img class="track-cover" src="/api/cover/${t.id}" loading="lazy" alt="" onerror="this.style.opacity=0"/>
      <div class="track-info">
        <div class="track-title">${esc(t.title)}</div>
        <div class="track-artist">${esc(t.artist||'')}</div>
      </div>
      <div class="track-dur">${fmt(t.duration||0)}</div>
      <button class="track-edit" title="Etiketleri düzenle" aria-label="Editar ${esc(t.title)}">${EDIT_ICON}</button>
      <button class="track-dl" title="Müziği indir" aria-label="İndir ${esc(t.title)}">${DL_ICON}</button>`;
    d.addEventListener('click', e => { if (e.target.closest('.track-dl,.track-edit')) return; playFromList(tracks, i); });
    d.querySelector('.track-dl').addEventListener('click', e => { e.stopPropagation(); downloadTrack(t); });
    d.querySelector('.track-edit').addEventListener('click', e => { e.stopPropagation(); openTagEditor(t.id); });
    ul.appendChild(d);
  });
  return ul;
}

function renderTracks(tracks) {
  tracksCache = tracks;
  lastRender = { title: $id('sec-title').textContent, fn: () => renderTracks(tracks) };
  const el = $id('results');
  if (!tracks.length) { el.innerHTML = '<div class="empty">Sonuç bulunamadı.</div>'; return; }
  const ul = buildTrackList(tracks);
  el.innerHTML = '';
  el.appendChild(ul);
  applyCascade(ul);
}

function renderCards(items, type) {
  lastRender = { title: $id('sec-title').textContent, fn: () => renderCards(items, type) };
  const el = $id('results');
  if (!items.length) { el.innerHTML = '<div class="empty">Sonuç bulunamadı.</div>'; return; }
  const g = document.createElement('div');
  g.className = 'card-grid';
  items.forEach(item => {
    const label = item.title || item.name || '';
    const parts = [];
    if (type === 'album' && item.artist) parts.push(item.artist);
    parts.push(`${item.count} ${item.count === 1 ? 'faixa' : 'faixas'}`);
    const c = document.createElement('div');
    c.className = 'card';
    c.innerHTML = `
      <img class="card-cover" src="/api/cover/${item.cover_id}" loading="lazy" alt="" onerror="this.style.opacity=0"/>
      <div class="card-body">
        <div class="card-title">${esc(label)}</div>
        <div class="card-sub">${esc(parts.join(' · '))}</div>
      </div>`;
    c.addEventListener('click', () => openCollection(type, item.id, label));
    g.appendChild(c);
  });
  el.innerHTML = '';
  el.appendChild(g);
  applyCascade(g);
}

// ── Download ──────────────────────────────────────
function _saveBlob(blob, filename) {
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url; a.download = filename; a.style.display = 'none';
  document.body.appendChild(a); a.click(); a.remove();
  setTimeout(() => URL.revokeObjectURL(url), 60_000);
}

async function downloadTrack(t) {
  toast(`Baixando ${t.title || 'música'}…`);
  try {
    const r = await fetch(`/api/download/${t.id}`);
    if (!r.ok) throw new Error('HTTP ' + r.status);
    const blob = await r.blob();
    const cd = r.headers.get('content-disposition') || '';
    const m = cd.match(/filename\*?=(?:UTF-8'')?"?([^";]+)"?/);
    const filename = m ? decodeURIComponent(m[1]) : `${t.title || 'faixa'}.mp3`;
    _saveBlob(blob, filename);
    toast(`Download concluído: ${filename}`);
  } catch (e) {
    toast('Müzik indirilemedi.');
  }
}

// ── Playback ───────────────────────────────────────
function tObj(t) {
  return { id: t.id, title: t.title || '—', artist: t.artist || '', album: t.album || '', duration: t.duration || 0 };
}

function playFromList(tracks, i) {
  queue = tracks.map(tObj);
  qIdx = i;
  playAt(qIdx);
  renderQueue();
}

function playAt(i) {
  if (i < 0 || i >= queue.length) return;
  qIdx = i;
  const t = queue[i];
  setAudioSrc(t.id, true);
  updateUI(t);
  setMediaSession(t);
  highlightList();
  highlightQueue();
  prefetchAround(i);
}

// Pré-carrega faixas vizinhas para troca instantânea.
const prefetchPool = new Map();
function prefetchAround(i) {
  [queue[i+1]?.id, queue[i-1]?.id, queue[i+2]?.id].filter(Boolean).forEach(id => {
    if (prefetchPool.has(id)) return;
    const a = new Audio();
    a.preload = 'auto'; a.muted = true; a.src = `/api/stream/${id}`;
    try { a.load(); } catch(e) {}
    prefetchPool.set(id, a);
    if (prefetchPool.size > 6) {
      const [oldId, oldEl] = prefetchPool.entries().next().value;
      try { oldEl.src = ''; oldEl.load(); } catch(e) {}
      prefetchPool.delete(oldId);
    }
  });
}

let currentSrcId = null;
function setAudioSrc(id, autoplay) {
  if (currentSrcId !== id) {
    audio.src = `/api/stream/${id}`;
    audio.load();
    currentSrcId = id;
  } else {
    try { audio.currentTime = 0; } catch(e) {}
  }
  if (autoplay) audio.play().catch(()=>{});
}

function updateUI(t) {
  const coverSrc = `/api/cover/${t.id}`;
  $id('mini-cover').src = coverSrc;
  $id('mini-title').textContent = t.title;
  $id('mini-artist').textContent = t.artist;
  $id('mini-player').classList.add('visible');
  $id('ps-cover').src = coverSrc;
  $id('ps-cover').classList.remove('paused');
  $id('ps-title').textContent = t.title;
  $id('ps-artist').textContent = t.artist;
  setPlayIcons(true);
  syncWaveform(true);
  document.title = `${t.title} — İNADINA TV`;
  loadDominantColor(coverSrc);
}

function setPlayIcons(playing) {
  const show = (el, v) => el.style.display = v ? '' : 'none';
  show($id('mp-play'), !playing);   show($id('mp-pause'), playing);
  show($id('ps-icon-play'), !playing); show($id('ps-icon-pause'), playing);
}

function togglePlay() {
  if (!audio.src) return;
  audio.paused ? audio.play().catch(()=>{}) : audio.pause();
}

// ── Media Session ────────────────────────────────────
function setMediaSession(t) {
  if (!('mediaSession' in navigator)) return;
  navigator.mediaSession.metadata = new MediaMetadata({
    title: t.title || '', artist: t.artist || '', album: t.album || 'İNADINA TV',
    artwork: [{ src: `/api/cover/${t.id}`, sizes: '512x512', type: 'image/jpeg' }]
  });
  navigator.mediaSession.playbackState = 'playing';
  const set = (a, h) => { try { navigator.mediaSession.setActionHandler(a, h); } catch(e){} };
  set('play',  () => audio.play());
  set('pause', () => audio.pause());
  set('previoustrack', () => prevTrack());
  set('nexttrack',     () => nextTrack());
  set('seekbackward', d => { audio.currentTime = Math.max(0, audio.currentTime - (d.seekOffset||10)); });
  set('seekforward',  d => { audio.currentTime = Math.min(audio.duration||0, audio.currentTime + (d.seekOffset||10)); });
  set('seekto', d => { if (d.fastSeek && audio.fastSeek) audio.fastSeek(d.seekTime); else audio.currentTime = d.seekTime; });
  set('stop', () => { audio.pause(); audio.currentTime = 0; });
}

function updatePositionState() {
  if (!('mediaSession' in navigator) || !navigator.mediaSession.setPositionState) return;
  if (!isFinite(audio.duration) || audio.duration <= 0) return;
  try {
    navigator.mediaSession.setPositionState({ duration: audio.duration, playbackRate: audio.playbackRate || 1, position: Math.min(audio.currentTime, audio.duration) });
  } catch(e) {}
}

audio.addEventListener('loadedmetadata', updatePositionState);
audio.addEventListener('timeupdate', updatePositionState);
audio.addEventListener('play',  () => { if ('mediaSession' in navigator) navigator.mediaSession.playbackState = 'playing'; });
audio.addEventListener('pause', () => { if ('mediaSession' in navigator) navigator.mediaSession.playbackState = 'paused'; });

audio.addEventListener('play',  () => { setPlayIcons(true);  syncWaveform(true);  $id('ps-cover').classList.remove('paused'); });
audio.addEventListener('pause', () => { setPlayIcons(false); syncWaveform(false); $id('ps-cover').classList.add('paused'); });
audio.addEventListener('ended', () => nextTrack());
audio.addEventListener('error', () => {
  if (queue.length > 1) {
    toast(`"${queue[qIdx]?.title || 'Faixa'}" indisponível — pulando…`);
    setTimeout(() => nextTrack(), 250);
  } else {
    toast('Müzik kullanılamıyor.');
  }
});

function nextTrack() {
  if (!queue.length) return;
  if (repeatMode === 'one') { audio.currentTime = 0; audio.play(); return; }
  let next = shuffle ? Math.floor(Math.random() * queue.length) : (qIdx + 1) % queue.length;
  if (next === 0 && repeatMode === 'none' && qIdx === queue.length - 1) return;
  qIdx = next; playAt(qIdx);
}

function prevTrack() {
  if (!queue.length) return;
  if (audio.currentTime > 3) { audio.currentTime = 0; return; }
  qIdx = (qIdx - 1 + queue.length) % queue.length;
  playAt(qIdx);
}

function toggleShuffle() { shuffle = !shuffle; $id('btn-shuffle').classList.toggle('active', shuffle); }
function toggleRepeat() {
  const m = ['none','all','one'];
  repeatMode = m[(m.indexOf(repeatMode)+1)%3];
  $id('btn-repeat').classList.toggle('active', repeatMode !== 'none');
  $id('btn-repeat').title = repeatMode === 'one' ? 'Bu parçayı tekrarla' : repeatMode === 'all' ? 'Tümünü tekrarla' : 'Tekrarla';
}

// ── Progress ───────────────────────────────────────
audio.addEventListener('timeupdate', () => {
  if (!audio.duration) return;
  const pct = (audio.currentTime / audio.duration) * 100;
  $id('mini-fill').style.width = pct + '%';
  $id('ps-fill').style.width = pct + '%';
  $id('ps-seek').value = pct;
  $id('ps-cur').textContent = fmt(audio.currentTime);
  $id('ps-dur').textContent = fmt(audio.duration);
});
function seekTo(v) { if (audio.duration) audio.currentTime = (v/100) * audio.duration; }

// ══ NAVEGAÇÃO COM HISTÓRICO ═════════════════════════
const views = [];
let vIdx = -1;
let sheetOpen = null;
let exitArmed = 0;

function go(view) {
  const cur = views[vIdx];
  if (cur && JSON.stringify(cur) === JSON.stringify(view)) { applyView(view); return; }
  views.length = vIdx + 1;
  views.push(view);
  vIdx = views.length - 1;
  history.pushState({ vIdx, sheet: sheetOpen }, '');
  applyView(view);
}

window.addEventListener('popstate', (e) => {
  const sheet = (e.state && e.state.sheet) || null;
  if (sheet !== sheetOpen) { sheetOpen = sheet; applySheets(); }
  const i = e.state && typeof e.state.vIdx === 'number' ? e.state.vIdx : -1;
  if (i >= 0 && i === vIdx) { syncNav(views[i]); return; }
  if (i < 0) {
    const now = Date.now();
    if (now - exitArmed < 2500) return;
    exitArmed = now;
    vIdx = 0;
    history.pushState({ vIdx: 0, sheet: sheetOpen }, '');
    applyView(views[0]);
    toast('Toque em voltar novamente para sair');
    return;
  }
  vIdx = i;
  applyView(views[i]);
});

function toast(msg) {
  const el = $id('toast');
  el.textContent = msg;
  el.classList.add('show');
  clearTimeout(toast._t);
  toast._t = setTimeout(() => el.classList.remove('show'), 2200);
}

function applyView(v) {
  syncNav(v);
  if (v.t === 'chart')      loadChart(v.type);
  else if (v.t === 'search') loadSearch(v.q, v.type);
  else if (v.t === 'collection') loadCollection(v.ctype, v.id, v.name);
}

function syncNav(v) {
  v = v || views[vIdx] || { t: 'chart', type: 'track' };
  const base = baseView();
  document.querySelectorAll('.tab').forEach(b => b.classList.toggle('active', b.dataset.type === (base.type || 'track')));
  const navActive = sheetOpen === 'queue' ? 'nav-queue' : (base.t === 'search' ? 'nav-search' : 'nav-home');
  document.querySelectorAll('.nav-btn').forEach(b => b.classList.remove('active'));
  $id(navActive)?.classList.add('active');
  if (base.t === 'search') $id('q').value = base.q || '';
  if (base.t === 'chart')  $id('q').value = '';
}

function baseView() {
  for (let i = vIdx; i >= 0; i--) {
    const v = views[i];
    if (v.t !== 'player' && v.t !== 'queue') return v;
  }
  return { t: 'chart', type: 'track' };
}

// ── Carregadores ────────────────────────────────────
async function loadChart(type) {
  setTitle('Sua Biblioteca');
  if (!LIB) spin();
  const lib = await loadLibrary();
  if (!lib.tracks.length) { renderEmptyLibrary(lib); return; }
  if (type === 'track')        renderTracks(lib.tracks);
  else if (type === 'album')   renderCards(albumGroups(lib.tracks), 'album');
  else if (type === 'playlist') renderCards(playlistGroups(lib.tracks), 'playlist');
  else if (type === 'artist')  renderCards(artistGroups(lib.tracks), 'artist');
  else renderTracks(lib.tracks);
}

function renderEmptyLibrary(lib) {
  $id('results').innerHTML = `
    <div class="empty" style="margin-top:40px;">
      Müzik bulunamadı.<br><br>
      Toque no botão <b>＋ Klasör</b> acima para selecionar sua pasta de músicas.
    </div>`;
}

function pickFolderToAdd() {
  const input = $id('folder-picker-input');
  if (input) {
    input.value = '';
    input.click();
  }
}

async function onFolderPicked(event) {
  const files = event.target.files;
  if (!files || !files.length) return;

  toast('Identificando pasta selecionada…');
  let relpath = '';
  for (let i = 0; i < Math.min(files.length, 10); i++) {
    if (files[i].webkitRelativePath) {
      relpath = files[i].webkitRelativePath;
      break;
    }
  }

  try {
    if (relpath) {
      const res = await fetch('/api/resolve_folder', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ relpath })
      });
      const data = await res.json();
      if (data.ok && data.path) {
        await addFolderToLibrary(data.path);
        return;
      }
    }

    const manualPath = prompt('Confirme o caminho da pasta no seu aparelho:', '/storage/emulated/0/Music');
    if (manualPath && manualPath.trim()) {
      await addFolderToLibrary(manualPath.trim());
    }
  } catch (err) {
    const manualPath = prompt('Informe o caminho da pasta no aparelho:', '/storage/emulated/0/Music');
    if (manualPath && manualPath.trim()) {
      await addFolderToLibrary(manualPath.trim());
    }
  }
}

async function addFolderToLibrary(path) {
  toast('Escaneando pasta…');
  try {
    const r = await fetch('/api/folders', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ path })
    });
    const d = await r.json();
    if (!d.ok) {
      toast(d.error || 'Não foi possível adicionar essa pasta.');
      return;
    }
    toast('Pasta adicionada com sucesso!');
    await loadLibrary(true);
    applyView(views[vIdx] || { t: 'chart', type: 'track' });
  } catch (err) {
    toast('Falha ao adicionar pasta.');
  }
}

function loadSearch(q, type) {
  const labels = { track:'Müzikler', album:'Albümler', playlist:'Çalma listeleri', artist:'Sanatçılar' };
  if (!q) { setTitle('Ara'); $id('results').innerHTML = '<div class="empty">Aramak için bir şey yazın.</div>'; return; }
  setTitle(`${labels[type] || 'Resultados'} · "${q}"`);
  if (!LIB) { spin(); loadLibrary().then(() => loadSearch(q, type)); return; }
  const query = q.toLowerCase();
  const match = t => `${t.title} ${t.artist} ${t.album}`.toLowerCase().includes(query);
  const filtered = LIB.tracks.filter(match);
  if (type === 'track') renderTracks(filtered);
  else if (type === 'album') renderCards(albumGroups(filtered), 'album');
  else if (type === 'playlist') renderCards(playlistGroups(filtered), 'playlist');
  else renderCards(artistGroups(filtered), 'artist');
}

async function loadCollection(ctype, id, name) {
  setTitle(name);
  if (!LIB) { $id('results').innerHTML = '<div class="spinner"></div>'; }
  const lib = await loadLibrary();
  const field = ctype === 'album' ? 'album' : ctype === 'artist' ? 'artist' : 'folder';
  const tracks = lib.tracks.filter(t => (t[field] || '—') === id);
  renderCollection(ctype, id, name, tracks);
}

const CH_TYPE_LABEL = { album: 'Álbum', playlist: 'Playlist', artist: 'Artista' };

function renderCollection(ctype, id, name, tracks) {
  const cover = tracks[0] ? `/api/cover/${tracks[0].id}` : '';
  const title = name;
  const sub  = ctype === 'album' ? (tracks[0]?.artist || '') : '';
  const meta = `${tracks.length} ${tracks.length === 1 ? 'faixa' : 'faixas'}`;
  lastRender = { title, fn: () => renderCollection(ctype, id, name, tracks) };

  const hero = document.createElement('div');
  hero.className = 'collection-hero';
  hero.innerHTML = `
    <img class="ch-cover${ctype === 'artist' ? ' artist' : ''}" src="${cover}" loading="lazy" alt=""/>
    <div class="ch-type">${CH_TYPE_LABEL[ctype] || ''}</div>
    <div class="ch-title">${esc(title)}</div>
    ${sub ? `<div class="ch-sub">${esc(sub)}</div>` : ''}
    <div class="ch-meta">${esc(meta)}</div>
    ${tracks.length ? `
    <div class="ch-actions">
      <button class="ch-btn ch-play" id="ch-play-btn">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="currentColor"><polygon points="5 3 19 12 5 21 5 3"/></svg>
        Tümünü çal
      </button>
      <button class="ch-btn ch-shuffle-btn" id="ch-shuffle-btn">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="16 3 21 3 21 8"/><line x1="4" y1="20" x2="21" y2="3"/><polyline points="21 16 21 21 16 21"/><line x1="15" y1="15" x2="21" y2="21"/></svg>
        Karışık çal
      </button>
    </div>` : ''}`;

  const el = $id('results');
  el.innerHTML = '';
  el.appendChild(hero);

  if (tracks.length) {
    tracksCache = tracks;
    const ul = buildTrackList(tracks);
    el.appendChild(ul);
    applyCascade(el);
    $id('ch-play-btn').addEventListener('click', () => playFromList(tracks, 0));
    $id('ch-shuffle-btn').addEventListener('click', () => {
      shuffle = true;
      $id('btn-shuffle')?.classList.add('active');
      playFromList(tracks, Math.floor(Math.random() * tracks.length));
    });
  } else {
    const empty = document.createElement('div');
    empty.className = 'empty';
    empty.textContent = 'Müzik bulunamadı.';
    el.appendChild(empty);
  }
}

// ── Ações da interface ─────────────────────────────
function setTab(btn) {
  const type = btn.dataset.type;
  const q = $id('q').value.trim();
  go(q ? { t:'search', q, type } : { t:'chart', type });
}
function doSearch() {
  const q = $id('q').value.trim();
  if (!q) return;
  $id('q').blur();
  go({ t:'search', q, type: baseView().type || 'track' });
}
function openCollection(type, id, name) { go({ t:'collection', ctype:type, id, name }); }
function navHome() { go({ t:'chart', type: 'track' }); }
function navSearch() {
  const q = $id('q').value.trim();
  go(q ? { t:'search', q, type: baseView().type || 'track' } : { t:'search', q:'', type:'track' });
  if (!q) $id('q').focus();
}

// ── Bottom sheets ────────────────────────────────────
function applySheets() {
  $id('player-sheet').classList.toggle('open', sheetOpen === 'player');
  $id('queue-sheet').classList.toggle('open', sheetOpen === 'queue');
  document.body.classList.toggle('sheet-open', !!sheetOpen);
  if (sheetOpen === 'queue') renderQueue();
  syncNav();
}
function openSheet(name) {
  if (sheetOpen === name) return;
  const had = !!sheetOpen;
  sheetOpen = name;
  applySheets();
  const st = { vIdx, sheet: name };
  if (had) history.replaceState(st, '');
  else history.pushState(st, '');
}
function closeSheet() {
  if (!sheetOpen) return;
  sheetOpen = null;
  applySheets();
  if (history.state && history.state.sheet) history.back();
}
function openPlayer() { if (queue.length) openSheet('player'); }
function closePlayer() { if (sheetOpen === 'player') closeSheet(); }
function openQueue()  { openSheet('queue'); }
function closeQueue() { if (sheetOpen === 'queue') closeSheet(); }

// ── Fila ───────────────────────────────────────────
function clearQueue() {
  queue = []; qIdx = -1;
  audio.pause(); audio.src = ''; currentSrcId = null;
  $id('mini-player').classList.remove('visible');
  setPlayIcons(false);
  renderQueue();
  highlightList();
}

function renderQueue() {
  const el = $id('queue-list');
  if (!queue.length) { el.innerHTML = '<div class="empty" style="padding:24px">Çalma sırası boş.</div>'; return; }
  el.innerHTML = '';
  queue.forEach((t, i) => {
    const d = document.createElement('div');
    d.className = 'qi' + (i === qIdx ? ' now' : '');
    d.innerHTML = `
      <img src="/api/cover/${t.id}" alt="" onerror="this.style.opacity=0"/>
      <div class="qi-info">
        <div class="qi-t">${esc(t.title)}</div>
        <div class="qi-a">${esc(t.artist)}</div>
      </div>
      <button class="qi-dl" title="Müziği indir" aria-label="İndir ${esc(t.title)}">${DL_ICON}</button>
      <button class="qi-rm" onclick="rmQueue(event,${i})">✕</button>`;
    d.addEventListener('click', e => { if (e.target.closest('.qi-rm, .qi-dl')) return; qIdx = i; playAt(i); });
    d.querySelector('.qi-dl').addEventListener('click', e => { e.stopPropagation(); downloadTrack(t); });
    el.appendChild(d);
  });
}

function rmQueue(e, i) {
  e.stopPropagation();
  queue.splice(i, 1);
  if (i < qIdx) qIdx--;
  else if (i === qIdx) { if (queue.length) playAt(qIdx % queue.length); else clearQueue(); }
  renderQueue(); highlightList();
}

function highlightQueue() { document.querySelectorAll('.qi').forEach((el, i) => el.classList.toggle('now', i === qIdx)); }
function highlightList() {
  const cur = queue[qIdx];
  document.querySelectorAll('.track-item').forEach((el, i) => el.classList.toggle('playing', cur && tracksCache[i]?.id === cur.id));
}

// ── Identificação via Deezer ─────────────────────────
async function lookupDeezer() {
  if (!editingId) return;
  const id = editingId;
  const btn = $id('ts-deezer-btn');
  const box = $id('ts-deezer-result');
  btn.disabled = true; btn.textContent = 'Buscando…';
  box.style.display = 'none';
  try {
    const r = await fetch(`/api/deezer/${id}`);
    const d = await r.json();
    if (!r.ok || d.ok === false) throw new Error(d.error || ('HTTP ' + r.status));
    if (!d.match) {
      box.innerHTML = `<div class="ts-deezer-empty">Não encontrei essa música no Deezer.</div>`;
    } else {
      const m = d.match;
      box.innerHTML = `
        <img src="${esc(m.cover || '')}" alt="" onerror="this.style.opacity=0"/>
        <div class="ts-deezer-info">
          <div class="ts-deezer-title">${esc(m.title)}</div>
          <div class="ts-deezer-sub">${esc(m.artist)}${m.album ? ' · ' + esc(m.album) : ''}</div>
        </div>
        <button type="button" class="ts-deezer-use" onclick="applyDeezer()">Usar</button>`;
    }
    box.style.display = 'flex';
  } catch (e) {
    toast('Falha ao buscar no Deezer.');
  } finally {
    btn.disabled = false; btn.textContent = '🔎 Deezer ile tanımla';
  }
}

async function applyDeezer() {
  if (!editingId) return;
  const id = editingId;
  const box = $id('ts-deezer-result');
  const useBtn = box.querySelector('.ts-deezer-use');
  if (useBtn) { useBtn.disabled = true; useBtn.textContent = 'Aplicando…'; }
  try {
    const r = await fetch(`/api/deezer/${id}/apply`, { method: 'POST' });
    const d = await r.json().catch(() => ({}));
    if (!r.ok || d.ok === false) throw new Error(d.error || ('HTTP ' + r.status));
    toast('Metadados atualizados a partir do Deezer.');
    await openTagEditor(id);   // recarrega os campos com o que foi gravado
    await loadLibrary(true);
    if (lastRender) lastRender.fn();
  } catch (e) {
    toast('Falha ao aplicar os dados do Deezer.');
    if (useBtn) { useBtn.disabled = false; useBtn.textContent = 'Usar'; }
  }
}

async function saveTags() {
  if (!editingId) return;
  const btn = $id('ts-save-btn');
  btn.disabled = true; btn.textContent = 'Salvando…';
  const fd = new FormData();
  fd.append('title', $id('ts-title').value);
  fd.append('artist', $id('ts-artist').value);
  fd.append('album', $id('ts-album').value);
  fd.append('album_artist', $id('ts-albumartist').value);
  fd.append('genre', $id('ts-genre').value);
  fd.append('date', $id('ts-date').value);
  fd.append('track', $id('ts-track').value);
  fd.append('lyrics', $id('ts-lyrics').value);
  if (editingCoverFile) fd.append('cover', editingCoverFile);
  const id = editingId;
  try {
    const r = await fetch(`/api/tags/${id}`, { method: 'POST', body: fd });
    const d = await r.json().catch(() => ({}));
    if (!r.ok || d.ok === false) throw new Error(d.error || ('HTTP ' + r.status));
    await loadLibrary(true);
    if (queue[qIdx]?.id === id) {
      const fresh = LIB.tracks.find(x => x.id === id);
      if (fresh) { queue[qIdx] = tObj(fresh); updateUI(queue[qIdx]); setMediaSession(queue[qIdx]); }
    }
    if (lastRender) lastRender.fn();
    toast('Tags atualizadas.');
    closeTagEditor();
  } catch (e) {
    toast('Falha ao salvar tags (verifique se o ffmpeg está instalado).');
  } finally {
    btn.disabled = false; btn.textContent = 'Kaydet';
  }
}

// ══ COR DOMINANTE DINÂMICA (mesma origem, sem CORS) ═══
function applyDominantColor(src) {
  if (!src) return;
  const sheet = $id('player-sheet');
  let bg = sheet.querySelector('.ps-bg-blur');
  if (!bg) {
    bg = document.createElement('div');
    bg.className = 'ps-bg-blur';
    bg.style.cssText = `position:absolute;inset:0;z-index:-1;pointer-events:none;background-size:cover;background-position:center;filter:blur(60px) brightness(.28) saturate(2);transform:scale(1.1);transition:background-image .6s ease, opacity .6s ease;`;
    sheet.insertBefore(bg, sheet.firstChild);
  }
  bg.style.backgroundImage = `url('${src}')`;

  const img = new Image();
  img.onload = () => {
    try {
      const c = document.createElement('canvas');
      c.width = c.height = 8;
      const ctx = c.getContext('2d');
      ctx.drawImage(img, 0, 0, 8, 8);
      const d = ctx.getImageData(0,0,8,8).data;
      let r=0,g=0,b=0,n=0;
      for (let i=0;i<d.length;i+=4) {
        const lum = d[i]*.299+d[i+1]*.587+d[i+2]*.114;
        if (lum>15 && lum<230) { r+=d[i];g+=d[i+1];b+=d[i+2];n++; }
      }
      if (n) {
        const light = `rgb(${Math.round(r/n)},${Math.round(g/n)},${Math.round(b/n)})`;
        document.documentElement.style.setProperty('--dom-accent', light);
        $id('mini-player').style.borderColor = `rgba(${Math.round(r/n)},${Math.round(g/n)},${Math.round(b/n)},.4)`;
      }
    } catch(e) {}
  };
  img.onerror = () => {};
  img.src = src;
}
function loadDominantColor(src) { applyDominantColor(src); }

// ══ GESTOS DO PLAYER ═══════════════════════════════
(function initPlayerGestures() {
  const sheet = $id('player-sheet');
  const coverWrap = sheet.querySelector('.ps-cover-wrap');
  const cover = $id('ps-cover');
  let startX = 0, startY = 0, curX = 0, curY = 0, axis = null, dragging = false;

  function start(x, y, lockedAxis) {
    startX = x; startY = y; curX = x; curY = y;
    axis = lockedAxis || null;
    dragging = true;
    sheet.style.transition = 'none';
    cover.style.transition = 'none';
  }
  function move(x, y) {
    if (!dragging) return;
    curX = x; curY = y;
    const dx = x - startX, dy = y - startY;
    if (!axis) {
      if (Math.abs(dx) > 12 || Math.abs(dy) > 12) axis = Math.abs(dx) > Math.abs(dy) ? 'x' : 'y';
      else return;
    }
    if (axis === 'y') {
      const d = Math.max(0, dy);
      sheet.style.transform = d > 0 ? `translateY(${d}px)` : '';
    } else {
      cover.style.transform = `translateX(${dx}px) rotate(${dx / 40}deg)`;
      cover.style.opacity = String(Math.max(0.4, 1 - Math.abs(dx) / 300));
    }
  }
  function slideCoverTo(dir, cb) {
    cover.style.transition = 'transform .22s ease, opacity .22s ease';
    cover.style.transform = `translateX(${dir * 380}px) rotate(${dir * 12}deg)`;
    cover.style.opacity = '0';
    setTimeout(() => {
      cb();
      cover.style.transition = 'none';
      cover.style.transform = `translateX(${-dir * 380}px)`;
      void cover.offsetWidth;
      cover.style.transition = 'transform .28s cubic-bezier(.22,1,.36,1), opacity .28s ease';
      cover.style.transform = '';
      cover.style.opacity = '1';
      setTimeout(() => { cover.style.transition = ''; cover.style.transform = ''; cover.style.opacity = ''; }, 300);
    }, 220);
  }
  function end() {
    if (!dragging) return;
    dragging = false;
    sheet.style.transition = '';
    if (axis === 'y') {
      const dy = curY - startY;
      sheet.style.transform = '';
      if (dy > 80) closePlayer();
    } else if (axis === 'x') {
      const dx = curX - startX;
      cover.style.transition = 'transform .25s cubic-bezier(.22,1,.36,1), opacity .2s ease';
      if (dx > 70 && queue.length > 1) slideCoverTo(1, () => prevTrack());
      else if (dx < -70 && queue.length > 1) slideCoverTo(-1, () => nextTrack());
      else {
        cover.style.transform = '';
        cover.style.opacity = '';
        setTimeout(() => { cover.style.transition = ''; }, 260);
      }
    }
    axis = null;
  }
  const vTriggers = [sheet.querySelector('.ps-swipe-handle'), sheet.querySelector('.ps-header')].filter(Boolean);
  vTriggers.forEach(el => el.addEventListener('touchstart', e => {
    if (e.touches.length !== 1) return;
    start(e.touches[0].clientX, e.touches[0].clientY, 'y');
  }, { passive: true }));
  if (coverWrap) coverWrap.addEventListener('touchstart', e => {
    if (e.touches.length !== 1) return;
    start(e.touches[0].clientX, e.touches[0].clientY);
  }, { passive: true });
  sheet.addEventListener('touchmove', e => { if (!dragging) return; move(e.touches[0].clientX, e.touches[0].clientY); }, { passive: true });
  sheet.addEventListener('touchend', end, { passive: true });
  sheet.addEventListener('touchcancel', end, { passive: true });
})();

// ══ GESTO DE FECHAR A FILA ═══════════════════════════
(function initQueueGesture() {
  const sheet  = $id('queue-sheet');
  const drawer = sheet.querySelector('.qs-drawer');
  const handle = sheet.querySelector('.qs-handle');
  const head   = sheet.querySelector('.qs-head');
  let y0 = 0, dy = 0, dragging = false;
  const start = e => { dragging = true; dy = 0; y0 = e.touches ? e.touches[0].clientY : e.clientY; drawer.style.transition = 'none'; };
  const move = e => {
    if (!dragging) return;
    const y = e.touches ? e.touches[0].clientY : e.clientY;
    dy = Math.max(0, y - y0);
    drawer.style.transform = `translateY(${dy}px)`;
  };
  const end = () => {
    if (!dragging) return;
    dragging = false;
    drawer.style.transition = '';
    drawer.style.transform = '';
    if (dy > 90) closeQueue();
  };
  [handle, head].forEach(el => {
    if (!el) return;
    el.addEventListener('touchstart', start, { passive: true });
    el.addEventListener('touchmove',  move,  { passive: true });
    el.addEventListener('touchend',   end,   { passive: true });
    el.addEventListener('touchcancel', end,  { passive: true });
  });
})();

document.addEventListener('keydown', e => { if (e.key === 'Escape') { closeSheet(); closeTagEditor(); } });

// ══ COMPARTILHAR MÚSICA ══════════════════════════════
async function shareTrack() {
  const t = queue[qIdx];
  if (!t) return;
  if (navigator.share) {
    try {
      const r = await fetch(`/api/stream/${t.id}`);
      const blob = await r.blob();
      const file = new File([blob], `${t.artist} - ${t.title}.mp3`, { type: blob.type || 'audio/mpeg' });
      if (navigator.canShare && navigator.canShare({ files: [file] })) {
        await navigator.share({ files: [file], title: t.title, text: `${t.title} — ${t.artist}` });
        return;
      }
    } catch(e) {}
    navigator.share({ title: t.title, text: `${t.title} — ${t.artist}` }).catch(()=>{});
  } else {
    navigator.clipboard?.writeText(`${t.title} — ${t.artist}`).then(() => toast('Copiado!')).catch(()=>{});
  }
}

// ══ CONTINUAR DE ONDE PAROU ══════════════════════════
const PERSIST_KEY = 'wave_local_session_v1';
function saveSession() {
  if (!queue.length || qIdx < 0) return;
  try { localStorage.setItem(PERSIST_KEY, JSON.stringify({ queue, qIdx, pos: audio.currentTime, ts: Date.now() })); } catch(e) {}
}
function restoreSession() {
  try {
    const raw = localStorage.getItem(PERSIST_KEY);
    if (!raw) return;
    const s = JSON.parse(raw);
    if (!s.queue?.length || Date.now() - s.ts > 3600_000) return;
    queue = s.queue; qIdx = s.qIdx;
    const t = queue[qIdx];
    if (!t) return;
    setAudioSrc(t.id, false);
    const seekTo = s.pos || 0;
    audio.addEventListener('loadedmetadata', function once() {
      audio.removeEventListener('loadedmetadata', once);
      try { audio.currentTime = seekTo; } catch(e) {}
    });
    updateUI(t); setMediaSession(t); highlightList(); highlightQueue(); prefetchAround(qIdx);
    toast(`▶ Continuando: ${t.title}`);
  } catch(e) {}
}
audio.addEventListener('pause', saveSession);
window.addEventListener('pagehide', saveSession);
window.addEventListener('beforeunload', saveSession);

// ══ PWA — MANIFEST DINÂMICO (sem recursos externos) ══
(function installManifest() {
  const icon = 'data:image/svg+xml;base64,' + btoa('<svg xmlns="http://www.w3.org/2000/svg" width="192" height="192"><rect width="192" height="192" fill="#0d0d0f"/><circle cx="96" cy="96" r="60" fill="none" stroke="#c084fc" stroke-width="14"/></svg>');
  const m = {
    name: 'İNADINA TV Müzik Çalar', short_name: 'İNADINA TV', start_url: '/', display: 'standalone',
    background_color: '#0d0d0f', theme_color: '#a259ff',
    icons: [{ src: icon, sizes: '192x192', type: 'image/svg+xml' }]
  };
  const blob = new Blob([JSON.stringify(m)], { type: 'application/json' });
  const link = document.createElement('link');
  link.rel = 'manifest';
  link.href = URL.createObjectURL(blob);
  document.head.appendChild(link);
})();

// ══ BLOQUEIO DE CÓPIA ──────────────────────────────
['copy','cut','contextmenu','dragstart','selectstart'].forEach(evt =>
  document.addEventListener(evt, e => {
    const t = e.target;
    if (t && (t.tagName === 'INPUT' || t.tagName === 'TEXTAREA') && evt !== 'copy' && evt !== 'cut') return;
    e.preventDefault();
  }, { capture: true })
);
document.addEventListener('keydown', e => {
  const k = (e.key || '').toLowerCase();
  if ((e.ctrlKey || e.metaKey) && ['c','x','a','s','u','p'].includes(k)) { e.preventDefault(); return; }
  if (e.key === 'F12') e.preventDefault();
}, { capture: true });

// ── Init ───────────────────────────────────────────
history.replaceState(null, '');
go({ t: 'chart', type: 'track' });
restoreSession();
